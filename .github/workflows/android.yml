name: Build Android APK & Play Store Bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for var_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Missing required GitHub repository secret: $var_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build debug APK and signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Prepare repository deliverables (src/app-test.apk & release/app-release.aab)
        run: |
          mkdir -p src release
          cp app/build/outputs/apk/debug/app-debug.apk src/app-test.apk
          cp app/build/outputs/bundle/release/app-release.aab release/app-release.aab

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-test-apk
          path: src/app-test.apk
          if-no-files-found: error

      - name: Upload Play Store bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: release/app-release.aab
          if-no-files-found: error

      - name: Commit APK and AAB to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/app-test.apk release/app-release.aab
          if ! git diff --cached --quiet; then
            git commit -m "Build artifacts: src/app-test.apk & release/app-release.aab [skip ci]"
            git push
          else
            echo "No artifact changes to commit."
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
