name: Build Android APK & Play Store Bundle

on:
  push:
  workflow_dispatch:
    inputs:
      build_play_bundle:
        description: 'Also build signed Play Store .aab (requires signing secrets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-debug-apk:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 36 and Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 --decode > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare debug APK deliverable (src/app-test.apk)
        run: |
          mkdir -p src
          cp app/build/outputs/apk/debug/app-debug.apk src/app-test.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-test-apk
          path: src/app-test.apk
          if-no-files-found: error

      - name: Commit debug APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/app-test.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build debug APK: src/app-test.apk [skip ci]"
            git push
          else
            echo "No debug APK changes to commit."
          fi

  build-play-bundle:
    if: "(github.event_name == 'workflow_dispatch' && inputs.build_play_bundle == true) || vars.ENABLE_PLAY_BUNDLE == 'true' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))"
    needs: build-debug-apk
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secrets for Play Store bundle
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FORCE_REQUIRED: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_play_bundle == true) || vars.ENABLE_PLAY_BUNDLE == 'true' }}
        run: |
          missing=0
          for var_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var_name}" ]; then
              missing=1
              if [ "$FORCE_REQUIRED" = "true" ]; then
                echo "::error::Missing required GitHub repository secret: $var_name"
              fi
            fi
          done
          if [ "$missing" -ne 0 ]; then
            if [ "$FORCE_REQUIRED" = "true" ]; then
              echo "Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD under GitHub -> Repository Settings -> Secrets and variables -> Actions -> Repository secrets."
              exit 1
            else
              echo "::notice::Skipping Play Store bundle (src/app-release.aab) because signing secrets are not configured yet. Add the 4 secrets in GitHub Settings -> Secrets and variables -> Actions to auto-build src/app-release.aab."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.check_secrets.outputs.ready == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 36 and Build Tools
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.check_secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper is executable
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Decode upload keystore
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed release AAB
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare Play Store bundle deliverable (src/app-release.aab)
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          mkdir -p src
          cp app/build/outputs/bundle/release/app-release.aab src/app-release.aab

      - name: Upload Play Store bundle artifact
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: src/app-release.aab
          if-no-files-found: error

      - name: Commit Play Store bundle to repository
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add -f src/app-release.aab
          if ! git diff --cached --quiet; then
            git commit -m "Build Play Store bundle: src/app-release.aab [skip ci]"
            git push
          else
            echo "No release bundle changes to commit."
          fi

      - name: Remove temporary keystore
        if: always() && steps.check_secrets.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
